default:
  target: dev
  outputs:
    default:
      type: snowflake
      account: ""       # e.g. myorg-myaccount
      user: ""          # your Snowflake username
      authenticator: externalbrowser
      role:      "{{ env_var('DBT_CURRENT_ROLE') }}"
      database:  "{{ env_var('DBT_DATABASE') }}"
      warehouse: "{{ env_var('DBT_WAREHOUSE') }}"
      schema:    "{{ env_var('DBT_ENV_SCHEMA_PREFIX', 'PUBLIC') }}"
      threads: 4

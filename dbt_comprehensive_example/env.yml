env_config:
  default_environment: dev
  environments:
  - name: dev
    env:
      DBT_CURRENT_WH: DEV_ANALYTICS_WH
      DBT_CURRENT_DB: DEV_ANALYTICS_DB
      DBT_CURRENT_SCHEMA: "{{ select CURRENT_USER() }}"
      DBT_CURRENT_ROLE: DEV_ANALYTICS_RL
      DBT_CURRENT_USER: "{{ select CURRENT_USER() }}"
      DBT_SOURCE_DB: DEV_RAW_DB
      DBT_SOURCE_SCHEMA: ORACLE
      DBT_DATA_INTERVAL_START: "2020-01-01 00:00:00"
      DBT_DATA_INTERVAL_END: "2099-12-31 23:59:59"
  - name: test
    env:
      DBT_CURRENT_WH: TEST_ANALYTICS_WH
      DBT_CURRENT_DB: TEST_ANALYTICS_DB
      DBT_CURRENT_SCHEMA: "{{ select CURRENT_USER() }}"
      DBT_CURRENT_ROLE: TEST_ANALYTICS_RL
      DBT_CURRENT_USER: "{{ select CURRENT_USER() }}"
      DBT_SOURCE_DB: TEST_RAW_DB
      DBT_SOURCE_SCHEMA: ORACLE
      DBT_DATA_INTERVAL_START: "{{ select (DATE_TRUNC('DAY', CURRENT_TIMESTAMP()) - INTERVAL '1 DAY')::string }}"
      DBT_DATA_INTERVAL_END: "{{ select (DATE_TRUNC('DAY', CURRENT_TIMESTAMP()) - INTERVAL '1 SECOND')::string }}"
  - name: prod
    env:
      DBT_CURRENT_WH: PROD_ANALYTICS_WH
      DBT_CURRENT_DB: PROD_ANALYTICS_DB
      DBT_CURRENT_SCHEMA: "{{ select CURRENT_USER() }}"
      DBT_CURRENT_ROLE: PROD_ANALYTICS_RL
      DBT_CURRENT_USER: "{{ select CURRENT_USER() }}"
      DBT_SOURCE_DB: PROD_RAW_DB
      DBT_SOURCE_SCHEMA: ORACLE
      DBT_DATA_INTERVAL_START: "{{ select (DATE_TRUNC('DAY', CURRENT_TIMESTAMP()) - INTERVAL '1 DAY')::string }}"
      DBT_DATA_INTERVAL_END: "{{ select (DATE_TRUNC('DAY', CURRENT_TIMESTAMP()) - INTERVAL '1 SECOND')::string }}"

# RAW_ORACLE source schema is shared across environments and never prefixed.
# Dev output schemas are prefixed with the current Snowflake user:
#   → <CURRENT_USER>_staging, <CURRENT_USER>_intermediate, <CURRENT_USER>_marts
# Test and prod use clean schema names: staging, intermediate, marts

env_config:
  default_environment: dev
  environments:
  - name: dev
    env:
      DBT_CURRENT_ROLE: DEV_ANALYTICS_RL
      DBT_DATABASE:     DEV_ANALYTICS_DB
      DBT_SOURCE_DB:    DEV_RAW_DB
      DBT_WAREHOUSE:    DEV_ANALYTICS_WH
      # Prefix output schemas with the current user for isolation
      DBT_ENV_SCHEMA_PREFIX: "{{ select CURRENT_USER() }}"

  - name: test
    env:
      DBT_CURRENT_ROLE: TEST_ANALYTICS_RL
      DBT_DATABASE:     TEST_ANALYTICS_DB
      DBT_SOURCE_DB:    TEST_RAW_DB
      DBT_WAREHOUSE:    TEST_ANALYTICS_WH
      # No DBT_ENV_SCHEMA_PREFIX → macro uses clean schema names directly

  - name: prod
    env:
      DBT_CURRENT_ROLE: PROD_ANALYTICS_RL
      DBT_DATABASE:     PROD_ANALYTICS_DB
      DBT_SOURCE_DB:    PROD_RAW_DB
      DBT_WAREHOUSE:    PROD_ANALYTICS_WH
      # No DBT_ENV_SCHEMA_PREFIX → macro uses clean schema names directly

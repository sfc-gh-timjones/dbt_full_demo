# RAW_ORACLE source schema is shared across environments and never prefixed.
# Dev output schemas are prefixed with the current Snowflake user:
#   → <CURRENT_USER>_staging, <CURRENT_USER>_intermediate, <CURRENT_USER>_provider, <CURRENT_USER>_vendor
# Test and prod use clean schema names: staging, intermediate, provider, vendor

env_config:
  default_environment: dev
  environments:
  - name: dev
    env:
      DBT_CURRENT_ROLE: DEV_ANALYTICS_RL # Role used for this environment. Has access to below objects.
      DBT_DATABASE:     DEV_ANALYTICS_DB # Database to write to for this environment.
      DBT_SOURCE_DB:    DEV_RAW_DB # Source database that staging pulls from.
      DBT_WAREHOUSE:    DEV_ANALYTICS_WH # Virtual Warehouse (compute) to use for this env.
      # Prefix output schemas with the current user for isolation
      DBT_ENV_SCHEMA_PREFIX: "{{ select CURRENT_USER() }}"

  - name: test
    env:
      DBT_CURRENT_ROLE: TEST_ANALYTICS_RL # Role used for this environment. Has access to below objects.
      DBT_DATABASE:     TEST_ANALYTICS_DB # Database to write to for this environment.
      DBT_SOURCE_DB:    TEST_RAW_DB # Source database that staging pulls from.
      DBT_WAREHOUSE:    TEST_ANALYTICS_WH # Virtual Warehouse (compute) to use for this env.
      # No DBT_ENV_SCHEMA_PREFIX → macro uses clean schema names directly

  - name: prod
    env:
      DBT_CURRENT_ROLE: PROD_ANALYTICS_RL # Role used for this environment. Has access to below objects.
      DBT_DATABASE:     PROD_ANALYTICS_DB # Database to write to for this environment.
      DBT_SOURCE_DB:    PROD_RAW_DB # Source database that staging pulls from.
      DBT_WAREHOUSE:    PROD_ANALYTICS_WH # Virtual Warehouse (compute) to use for this env.
      # No DBT_ENV_SCHEMA_PREFIX → macro uses clean schema names directly

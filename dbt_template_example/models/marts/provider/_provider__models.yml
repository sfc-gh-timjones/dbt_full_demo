version: 2

models:
  - name: dim_provider
    description: >
      Full provider directory. One row per provider with NPI, primary taxonomy,
      primary practice address, credentialing status, and age.
      Materialized as an incremental table: each dbt run upserts only providers
      whose last_modified_date is newer than the current max in this table.
    columns:
      - name: provider_id
        tests: [not_null, unique]
      - name: provider_type
        tests:
          - accepted_values:
              values: [INDIVIDUAL, ORGANIZATION, FACILITY, ANCILLARY, GROUP]
      - name: credentialing_flag
        tests:
          - accepted_values:
              values: [ACTIVE, PENDING, EXPIRED]
      - name: last_modified_date
        description: >
          Source system last-modified date cast to DATE. Used as the incremental
          watermark: rows with a date on or after the table's current max are
          included in the next dbt run (>= comparison ensures same-day batches
          are not silently dropped).
        tests: [not_null]

  - name: fct_provider_county_summary
    description: >
      Provider counts aggregated by county and provider type. Materialized as a
      Snowflake Dynamic Table with a 1-hour target lag. Snowflake refreshes this
      automatically when upstream source data changes — no dbt job needed.
      CHANGE_TRACKING on PROV (source table) is enabled in 02_incremental_data.sql.
    columns:
      - name: county
        tests: [not_null]
      - name: provider_type
        tests: [not_null]
      - name: total_providers
        tests: [not_null]

  - name: fct_provider_network_summary
    description: >
      One row per provider. Counts active network associations broken down by
      association type, plus a list of covered lines of business.
    columns:
      - name: provider_id
        tests: [not_null, unique]
      - name: total_associations
        tests: [not_null]

  - name: fct_credentialing_overview
    description: >
      Credentialing breakdown aggregated by county, area, provider type, and
      credentialing status. Includes counts, averages, and contact/language flags.
    columns:
      - name: county
        tests: [not_null]
      - name: provider_type
        tests: [not_null]
      - name: credentialing_flag
        tests:
          - accepted_values:
              values: [ACTIVE, PENDING, EXPIRED]
